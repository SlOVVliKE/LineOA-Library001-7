# ============================================================
#  Netlify configuration
#
#  base = "book-shop"  --> the Next.js app lives in a subfolder,
#  not at the repo root. Without this, Netlify finds no
#  package.json and deploys an empty site.
#
#  No plugin entry on purpose: Netlify auto-detects Next.js and
#  keeps its OpenNext adapter updated. Pinning it means missing
#  fixes for future Next.js releases.
#
#  ห้ามใส่ publish = ".next" เด็ดขาด
#  Next.js บน Netlify เป็น zero-config — adapter จะกำหนดโฟลเดอร์เผยแพร่เอง
#  ถ้าเราไปตั้ง publish ทับ Netlify จะถือว่านี่คือเว็บ static ธรรมดา
#  แล้วเสิร์ฟไฟล์ดิบใน .next ออกไปตรงๆ ซึ่งไม่มี index.html → 404 ทุกหน้า
#  และไม่มีการสร้าง server function ให้ด้วย (เคยพลาดมาแล้วรอบหนึ่ง)
# ============================================================

[build]
  base = "book-shop"
  command = "npm run build"

# supabase-js ต้องการ Node 22 ขึ้นไป (Node 20 ขึ้น EBADENGINE ตอน install)
[build.environment]
  NODE_VERSION = "22"

# ---------- scheduled functions (safety net only) ----------
# Notifications are sent immediately when an admin changes an order
# status, so these schedules are not what customers wait on. They
# exist to retry anything that failed at that moment, e.g. LINE
# being briefly unreachable.
[functions."cron-notifications"]
  schedule = "0 * * * *"

[functions."cron-expire-reservations"]
  schedule = "20 3 * * *"
